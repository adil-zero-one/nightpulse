kind: wasmer.io/App.v0
name: night-pulse-demo
owner: replace-with-your-wasmer-username
package: .
cli_args:
  - -m
  - flask
  - --app
  - /src/app
  - run
  - --host
  - 0.0.0.0
  - --port
  - "80"
  - --no-reload
env:
  PYTHONEXECUTABLE: /bin/python
  NODE_ENV: production
capabilities:
  database:
    engine: postgres
locality:
  regions:
    - fr-roub1
health_checks:
  - http:
      method: get
      path: /api/healthz
      interval: 30s
      timeout: 10s
      unhealthy_threshold: 2
      healthy_threshold: 1
      expected_status_codes:
        - 200
